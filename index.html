<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ارسال موقعیت مکانی</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { color: #1a1a2e; font-size: 22px; margin-bottom: 8px; }
    .subtitle { color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      width: 100%; padding: 16px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, #667eea, #764ba2); color: white;
      transition: transform .2s, box-shadow .2s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102,126,234,.4); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.success { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .status {
      margin-top: 16px; padding: 14px; border-radius: 10px; display: none;
      font-size: 13px; line-height: 1.6; text-align: right;
    }
    .status.show { display: block; }
    .status.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status.err { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .status.load { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid #bfdbfe; border-top-color:#2563eb; border-radius:50%; animation:spin 1s linear infinite; margin-left:8px; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .debug {
      margin-top: 16px; padding: 12px; background: #1e1e1e; color: #0f0;
      border-radius: 8px; font-size: 11px; font-family: monospace;
      min-height: 100px; max-height: 200px; overflow-y: auto;
      text-align: left; direction: ltr; white-space: pre-wrap;
      border: 1px solid #333;
    }
    .debug-line { margin: 2px 0; }
    .debug-line.error { color: #f88; }
    .debug-line.warn { color: #ff8; }
    .debug-line.ok { color: #8f8; }
    footer { margin-top: 24px; font-size: 11px; color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📍</div>
    <h1>ارسال موقعیت مکانی</h1>
    <p class="subtitle">دکمه را بزنید، اجازه دهید، مختصات به تلگرام ارسال می‌شود.</p>
    <button class="btn" id="btn" onclick="getLoc()">دریافت و ارسال موقعیت</button>
    <div class="status" id="st"></div>
    <div class="debug" id="db">=== DEBUG LOG START ===</div>
    <footer>فقط یک‌بار خوانده و بلافاصله ارسال می‌شود — ذخیره نمی‌شود.</footer>
  </div>
<script>
const ENDPOINT = 'https://location-sender.malachite-capricorn-eb8.workers.dev';
const btn = document.getElementById('btn');
const st = document.getElementById('st');
const db = document.getElementById('db');
let tryCount = 0;

function log(msg, type = '') {
  console.log('[LOC]', msg);
  const line = document.createElement('div');
  line.className = 'debug-line' + (type ? ' ' + type : '');
  line.textContent = '[' + new Date().toLocaleTimeString('fa-IR') + '] ' + msg;
  db.appendChild(line);
  db.scrollTop = db.scrollHeight;
}

function status(msg, type) {
  st.textContent = msg;
  st.className = 'status show ' + type;
}

function ready() {
  btn.disabled = false;
  btn.textContent = 'دریافت و ارسال موقعیت';
  btn.classList.remove('success');
  btn.style.background = '';
  log('✅ Ready for next click', 'ok');
}

function getLoc() {
  tryCount++;
  log('▶ Try #' + tryCount + ' – requesting GPS...');
  if (!navigator.geolocation) { status('❌ Browser unsupported', 'err'); return; }
  btn.disabled = true; btn.textContent = 'در حال دریافت GPS...'; status('⏳ Waiting for GPS fix...', 'load');
  navigator.geolocation.getCurrentPosition(onOk, onErr, { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
}

function onErr(e) {
  log('❌ Err ' + e.code + ': ' + e.message, 'error');
  let m = '❌ ';
  if (e.code===1) m += 'Permission denied. Tap lock icon → Location → Allow → Reload.';
  else if (e.code===2) m += 'GPS unavailable. Enable GPS, go outdoors, High accuracy mode.';
  else if (e.code===3) m += 'Timeout. Try again.';
  else m += e.message;
  status(m, 'err'); ready();
}

async function onOk(p) {
  const {latitude, longitude, accuracy} = p.coords;
  log('📍 Got: ' + latitude.toFixed(6) + ', ' + longitude.toFixed(6) + ' (±' + Math.round(accuracy) + 'm)', 'ok');
  status('⏳ Sending to server...', 'load');
  try {
    log('📤 POST to: ' + ENDPOINT);
    
    // Test connectivity first
    log('🔍 Testing connectivity (OPTIONS)...');
    const testRes = await fetch(ENDPOINT, {method:'OPTIONS'});
    log('🔍 OPTIONS test: ' + testRes.status, testRes.ok ? 'ok' : 'error');
    
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 25000);
    const r = await fetch(ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({latitude,longitude,accuracy}), signal: controller.signal});
    clearTimeout(timeout);
    log('📥 Response status: ' + r.status + ' ' + r.statusText, r.ok ? 'ok' : 'error');
    log('📥 Response headers: ' + [...r.headers.entries()].map(([k,v])=>k+':'+v).join(', '));
    const text = await r.text();
    log('📥 Raw response: ' + text.substring(0, 200));
    let j;
    try { j = JSON.parse(text); } catch (e) { log('📥 JSON parse failed: ' + e.message, 'error'); throw new Error('Invalid JSON: ' + text.substring(0,100)); }
    if (!j.ok) throw new Error(j.error||'Server error');
    log('📨 Server OK', 'ok');
    status('✅ Sent!\n🌍 ' + latitude.toFixed(6) + ', ' + longitude.toFixed(6) + '\n🎯 ±' + Math.round(accuracy) + 'm\n🕐 ' + new Date().toLocaleString('fa-IR'), 'ok');
    btn.textContent = '✅ ارسال شد — دوباره بفرست'; btn.classList.add('success'); btn.disabled = false;
    log('✅ Done. Button re-enabled.', 'ok');
  } catch (e) {
    log('📨 Send failed: ' + e.name + ': ' + e.message, 'error');
    if (e.name === 'AbortError') log('📨 Timeout (25s)', 'warn');
    if (e.name === 'TypeError') log('📨 Network error - check: offline, CORS, adblocker, private mode restrictions', 'warn');
    status('❌ Send error: ' + e.message + ' (' + e.name + ')', 'err'); ready();
  }
}
</script>
</body>
</html>
